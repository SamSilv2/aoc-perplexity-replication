[project]
name = "aoc-perplexity"
version = "1.0.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Perplexidade de LLMs diante de átomos de confusão"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Análise (trios, consolidado, EEG, figuras): leem as saídas salvas; transformers só para os tokenizadores.
dependencies = [
    "matplotlib>=3.11.2",
    "numpy",
    "pandas",
    "scipy",
    "transformers>=5.22.1",
]

[project.optional-dependencies]
# Inferência (perplexidade.py): torch para fp16 e MLX para os modelos quantizados.
inferencia = [
    "mlx>=0.32.4",
    "mlx-lm>=0.32.2",
    "torch>=2.15.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aoc_perplexity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
